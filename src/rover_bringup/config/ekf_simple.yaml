ekf_simple_node:
  ros__parameters:
    use_sim_time: false
    frequency: 15.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. Odometría de ruedas (relativa, continua)
    odom0: odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    
    # 2. Detección ArUco (absoluta, discreta)
    pose0: aruco_pose
    pose0_config: [true,  true,  false,
                   false, false, true,  # ¡Ahora el EKF absorbe el Yaw de los ArUcos!
                   false, false, false,
                   false, false, false,
                   false, false, false]
