ekf_local_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    # Frames vitales para RViz
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Configuración de Odometría (Ruedas del C++)
    odom0: odom
    odom0_config: [false, false, false, # X, Y, Z (Posición) -> FALSE
                   false, false, false, # Roll, Pitch, Yaw -> FALSE
                   true,  true,  false, # VX, VY, VZ (Velocidad lineal) -> TRUE
                   false, false, true,  # Vroll, Vpitch, Vyaw -> TRUE
                   false, false, false]
    odom0_queue_size: 10

    # Configuración de IMU (Gazebo)
    imu0: imu
    imu0_config: [false, false, false, # Posición X, Y, Z
                  false, false, false, # Roll, Pitch, Yaw absoluto -> FALSE (evita divergencia)
                  false, false, false, # VX, VY, VZ
                  true,  true,  true,  # Vroll, Vpitch, Vyaw -> TRUE
                  true,  true,  true]  # Aceleraciones lineales -> TRUE
    imu0_queue_size: 10

ekf_global_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    # El EKF global usa 'map' como su mundo
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # Misma odometría de las ruedas
    odom0: odom_gazebo
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    
    # Misma IMU
    imu0: imu
    imu0_config: [false, false, false, # Posición X, Y, Z
                  false, false, false, # Roll, Pitch, Yaw absolutos ignorados para estabilidad
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]

    # NUEVO: Detección absoluta de nuestro ArUco (X, Y y Yaw)
    pose0: aruco_pose
    pose0_config: [true,  true,  false,
                   false, false, false, # Dejamos que la IMU maneje el Yaw, ArUco solo corrige X,Y
                   false, false, false,
                   false, false, false,
                   false, false, false]

    # NUEVO: Detección global de AMCL (LiDAR)
    pose1: amcl_pose
    pose1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]