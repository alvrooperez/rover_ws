ekf_local_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.5    # Aumentado: IMU puede tener latencia de arranque
    two_d_mode: true
    publish_tf: true

    # Frames vitales para RViz
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Sin odometría de ruedas: solo IMU para dead-reckoning
    imu0: imu
    imu0_config: [false, false, false, # Posición X, Y, Z
                  false, false, false, # Roll, Pitch, Yaw absoluto -> FALSE (evita divergencia)
                  false, false, false, # VX, VY, VZ
                  true,  true,  true,  # Vroll, Vpitch, Vyaw -> TRUE
                  true,  true,  true]  # Aceleraciones lineales -> TRUE
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true  # Evita que la gravedad se integre como aceleración real

ekf_global_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.5    # Aumentado: tolerancia mientras ArUcos o AMCL no están disponibles
    two_d_mode: true
    publish_tf: true

    # El EKF global usa 'map' como su mundo
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # IMU: dead-reckoning entre correcciones absolutas
    imu0: imu
    imu0_config: [false, false, false, # Posición X, Y, Z
                  false, false, false, # Roll, Pitch, Yaw absolutos ignorados para estabilidad
                  false, false, false,
                  true,  true,  true,  # Vroll, Vpitch, Vyaw
                  true,  true,  true]  # Aceleraciones lineales
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    # ArUco: corrección absoluta de posición (X, Y) cuando sea visible
    pose0: aruco_pose
    pose0_config: [true,  true,  false,
                   false, false, true, # Yaw lo maneja AMCL con más consistencia
                   false, false, false,
                   false, false, false,
                   false, false, false]

    # AMCL (LiDAR): corrección global continua de X, Y y Yaw
    pose1: amcl_pose
    pose1_config: [true,  true,  false,
                   false, false, true,  # Yaw desde AMCL
                   false, false, false,
                   false, false, false,
                   false, false, false]